services:
  redis:
    image: redis:7
    container_name: retromol_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    # No ports: exposed only inside the Docker network
    networks: [ retromol_network ]

  maintenance:
    build:
      context: .
      dockerfile: gui/docker/maintenance.Dockerfile
    container_name: retromol_maintenance
    restart: unless-stopped
    env_file:
      - gui/docker/backend.env
    depends_on:
      redis:
        condition: service_started
    networks: [ retromol_network ]

  backend:
    build:
      context: .
      dockerfile: gui/docker/backend.Dockerfile
    container_name: retromol_backend
    restart: unless-stopped
    env_file:
      - gui/docker/backend.env
    environment:
      PARAS_MODEL_PATH: ${PARAS_MODEL_PATH}
      RETROMOL_DUCKDB_PATH: /data/retromol.duckdb
    volumes:
      - ${PARAS_MODEL_HOST_PATH}:${PARAS_MODEL_PATH}:ro
      - ${RETROMOL_DUCKDB_HOST_PATH}:/data/retromol.duckdb:ro
    depends_on:
      redis:
        condition: service_started
    networks: [ retromol_network ]

  web:
    build:
      context: .
      dockerfile: gui/docker/web.Dockerfile
    container_name: retromol_web
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "4005:80"
    networks: [ retromol_network ]

networks:
  retromol_network:
    driver: bridge